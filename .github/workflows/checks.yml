# On every push: the web app's types, the checks that need no database and no AI, the repo's standing rules, and
# a build. The end-to-end tests need a local Supabase and Chrome: the free ones run weekly in database.yml, the
# rest on a developer's computer (npm run test:e2e). No secrets are used here and nothing is deployed.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck

  # The connection promises Node 20 and later, and runs on Windows, Mac and Linux: its checks run on all of them.
  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: macos-latest, node: 22 }
          - { os: windows-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: node tools/house-rules.mjs
      - run: node tests/e2e/unit-scan.mjs
      - run: node tests/e2e/unit-prompts.mjs
      - run: node tests/e2e/unit-pointed.mjs
      - run: node tests/e2e/unit-land.mjs
      - run: node tests/e2e/unit-report.mjs
      - run: node tests/e2e/unit-pages.mjs
      - run: node tests/e2e/unit-slash.mjs
      - run: node tests/e2e/unit-update.mjs
      - run: node tests/e2e/unit-connection.mjs
      - run: node tests/e2e/unit-approve.mjs
      - run: node tests/e2e/unit-sessions.mjs
      - run: node tests/e2e/unit-procs.mjs
      - run: node tests/e2e/unit-inbox.mjs
      - run: node tests/e2e/chaos-connect.mjs

  # The connection starting at login and starting again after an update, for real, on a Mac (launchd) and on Linux
  # (systemd). These machines are thrown away afterwards; the test refuses to run anywhere else.
  startup:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: A user session for systemd (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          for i in $(seq 1 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - run: node tests/e2e/os-autostart.mjs

  # The connection's chaos checks over many more seeded random inputs (a few minutes). No AI, no network.
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tests/e2e/chaos-connect.mjs
        env:
          CHAOS_FULL: "1"

  # The address and key below are stand-ins: a build only needs them to be there.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
