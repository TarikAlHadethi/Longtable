# On every push: the web app's types. The end-to-end tests need a local Supabase and Chrome, so they run on a
# developer's computer for now (npm run test:e2e).
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
